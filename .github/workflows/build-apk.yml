          # 12. SensorFusion.kt (3B Optik Vektör + Gerçek Zamanlı Manyetik Anomali Tespiti)
          cat << 'EOF' > app/src/main/java/tr/gov/ogm/gozetleme/SensorFusion.kt
          package tr.gov.ogm.gozetleme

          import android.content.Context
          import android.hardware.GeomagneticField
          import android.hardware.Sensor
          import android.hardware.SensorEvent
          import android.hardware.SensorEventListener
          import android.hardware.SensorManager
          import kotlin.math.*

          class SensorFusion(
              private val context: Context,
              private val onOrientationChanged: (
                  azimuthTrueDeg: Float,
                  rawAzimuthTrueDeg: Float,
                  pitchDeg: Float,
                  fieldStrengthUt: Float,
                  expectedFieldUt: Float,
                  isAnomaly: Boolean,
                  anomalyReason: String
              ) -> Unit
          ) : SensorEventListener {

              private val sensorManager = context.getSystemService(Context.SENSOR_SERVICE) as SensorManager
              private val rotationSensor = sensorManager.getDefaultSensor(Sensor.TYPE_ROTATION_VECTOR)
              private val magneticSensor = sensorManager.getDefaultSensor(Sensor.TYPE_MAGNETIC_FIELD)

              private val rotationMatrix = FloatArray(9)

              var magneticDeclination: Float = 5.6f
              var expectedFieldStrengthUt: Float = 47.0f
              var manualAzimuthOffset: Float = 0f
              var manualPitchOffset: Float = 0f

              var lastRawAzimuthTrueDeg: Float = 0f
                  private set
              var currentFieldStrengthUt: Float = 47.0f
                  private set
              var isMagneticAnomaly: Boolean = false
                  private set
              var anomalyReason: String = ""
                  private set

              private var magAccuracy: Int = SensorManager.SENSOR_STATUS_ACCURACY_HIGH
              private val magHistory = FloatArray(10)
              private var magIdx = 0
              private var magSamples = 0
              private var fieldJitterUt = 0f

              private var smoothSinAz = 0f
              private var smoothCosAz = 1f
              private var smoothPitch = 0f
              private val alpha = 0.15f

              fun updateDeclination(lat: Double, lon: Double, alt: Double) {
                  val field = GeomagneticField(lat.toFloat(), lon.toFloat(), alt.toFloat(), System.currentTimeMillis())
                  magneticDeclination = field.declination
                  expectedFieldStrengthUt = (field.fieldStrength / 1000f).coerceIn(30f, 65f)
              }

              fun calibrateAzimuthToKnownBearing(trueBearingDeg: Double): Float {
                  val diff = ((trueBearingDeg - lastRawAzimuthTrueDeg.toDouble() + 540.0) % 360.0) - 180.0
                  manualAzimuthOffset = diff.toFloat()
                  return manualAzimuthOffset
              }

              fun start() {
                  rotationSensor?.let {
                      sensorManager.registerListener(this, it, SensorManager.SENSOR_DELAY_GAME)
                  }
                  magneticSensor?.let {
                      sensorManager.registerListener(this, it, SensorManager.SENSOR_DELAY_UI)
                  }
              }

              fun stop() {
                  sensorManager.unregisterListener(this)
              }

              private fun evaluateMagneticHealth() {
                  if (magneticSensor == null) {
                      isMagneticAnomaly = false
                      anomalyReason = ""
                      return
                  }
                  val deviation = abs(currentFieldStrengthUt - expectedFieldStrengthUt)
                  when {
                      deviation > 15f || currentFieldStrengthUt < 25f || currentFieldStrengthUt > 70f -> {
                          isMagneticAnomaly = true
                          anomalyReason = "Manyetik alan şiddeti anormal (Metal/Telsiz yakın)"
                      }
                      fieldJitterUt > 6f -> {
                          isMagneticAnomaly = true
                          anomalyReason = "Manyetik alan kararsız / dalgalı"
                      }
                      magAccuracy == SensorManager.SENSOR_STATUS_UNRELIABLE ||
                      magAccuracy == SensorManager.SENSOR_STATUS_ACCURACY_LOW -> {
                          isMagneticAnomaly = true
                          anomalyReason = "Pusula kalibrasyon doğruluğu düşük"
                      }
                      else -> {
                          isMagneticAnomaly = false
                          anomalyReason = ""
                      }
                  }
              }

              override fun onSensorChanged(event: SensorEvent?) {
                  if (event == null) return

                  if (event.sensor.type == Sensor.TYPE_MAGNETIC_FIELD) {
                      val mx = event.values[0]
                      val my = event.values[1]
                      val mz = event.values[2]
                      val mag = sqrt(mx * mx + my * my + mz * mz)
                      currentFieldStrengthUt = currentFieldStrengthUt * 0.7f + mag * 0.3f

                      magHistory[magIdx] = mag
                      magIdx = (magIdx + 1) % magHistory.size
                      if (magSamples < magHistory.size) magSamples++

                      if (magSamples >= 5) {
                          var minV = Float.MAX_VALUE
                          var maxV = Float.MIN_VALUE
                          for (i in 0 until magSamples) {
                              if (magHistory[i] < minV) minV = magHistory[i]
                              if (magHistory[i] > maxV) maxV = magHistory[i]
                          }
                          fieldJitterUt = maxV - minV
                      }
                      evaluateMagneticHealth()
                      return
                  }

                  if (event.sensor.type != Sensor.TYPE_ROTATION_VECTOR) return

                  SensorManager.getRotationMatrixFromVector(rotationMatrix, event.values)

                  val forwardEast = -rotationMatrix[2].toDouble()
                  val forwardNorth = -rotationMatrix[5].toDouble()
                  val forwardUp = -rotationMatrix[8].toDouble()

                  val horizMag = hypot(forwardEast, forwardNorth)
                  val rawAzRad = if (horizMag > 1e-4) atan2(forwardEast, forwardNorth) else 0.0
                  val rawPitchDeg = Math.toDegrees(atan2(forwardUp, horizMag)).toFloat()

                  smoothSinAz = smoothSinAz + alpha * (sin(rawAzRad).toFloat() - smoothSinAz)
                  smoothCosAz = smoothCosAz + alpha * (cos(rawAzRad).toFloat() - smoothCosAz)
                  smoothPitch = smoothPitch + alpha * (rawPitchDeg - smoothPitch)

                  val filteredAzDeg = Math.toDegrees(atan2(smoothSinAz.toDouble(), smoothCosAz.toDouble())).toFloat()
                  val rawTrueAz = (filteredAzDeg + magneticDeclination + 360f) % 360f
                  lastRawAzimuthTrueDeg = rawTrueAz

                  val calibratedAz = (rawTrueAz + manualAzimuthOffset + 360f) % 360f
                  val calibratedPitch = (smoothPitch + manualPitchOffset).coerceIn(-89f, 89f)

                  onOrientationChanged(
                      calibratedAz,
                      rawTrueAz,
                      calibratedPitch,
                      currentFieldStrengthUt,
                      expectedFieldStrengthUt,
                      isMagneticAnomaly,
                      anomalyReason
                  )
              }

              override fun onAccuracyChanged(sensor: Sensor?, accuracy: Int) {
                  if (sensor?.type == Sensor.TYPE_MAGNETIC_FIELD) {
                      magAccuracy = accuracy
                      evaluateMagneticHealth()
                  }
              }
          }
          EOF

          # 13. ArOverlayView.kt (Yatay Kalibrasyon Kilidi + Orijinal Sıfır Referans Çizgisi + Anomali Uyarısı)
          cat << 'EOF' > app/src/main/java/tr/gov/ogm/gozetleme/ArOverlayView.kt
          package tr.gov.ogm.gozetleme

          import android.content.Context
          import android.graphics.*
          import android.view.MotionEvent
          import android.view.View
          import java.util.Locale
          import kotlin.math.*

          class ArOverlayView(
              context: Context,
              private val onManualCalibrate: (dAz: Float, dPitch: Float) -> Unit
          ) : View(context) {

              var currentAzimuth = 0f
              var rawAzimuth = 0f
              var manualAzimuthOffset = 0f
              var currentPitch = 0f
              var currentZoomRatio = 1.0f
              var baseHorizontalFov = 62f
              var baseVerticalFov = 46f

              var isHorizontalCalLocked = true
              var isMagneticAnomaly = false
              var magneticFieldUt = 47f
              var expectedFieldUt = 47f
              var anomalyReason = ""

              var horizonProfile: List<HorizonProfilePoint> = emptyList()
              var currentHit: RayHitResult? = null
              var secondObserverRay: ObserverPacket? = null
              var observerLat = 0.0
              var observerLon = 0.0
              var observerAlt = 0.0
              var activeUserLabel = ""

              private val paintHorizon = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = Color.parseColor("#00FF66")
                  strokeWidth = 4f
                  style = Paint.Style.STROKE
              }

              private val paintContour = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = Color.parseColor("#AA00E5FF")
                  strokeWidth = 2f
                  style = Paint.Style.FILL_AND_STROKE
              }

              private val paintCrosshair = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = Color.RED
                  strokeWidth = 3.5f
                  style = Paint.Style.STROKE
              }

              private val paintRawZeroLine = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = Color.parseColor("#FFFF9100")
                  strokeWidth = 3f
                  style = Paint.Style.STROKE
                  pathEffect = DashPathEffect(floatArrayOf(16f, 12f), 0f)
              }

              private val paintRawZeroText = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = Color.parseColor("#FFFFAB40")
                  textSize = 22f
                  typeface = Typeface.create(Typeface.MONOSPACE, Typeface.BOLD)
                  setShadowLayer(4f, 2f, 2f, Color.BLACK)
              }

              private val paintSecondRay = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = Color.YELLOW
                  strokeWidth = 4f
                  style = Paint.Style.STROKE
                  pathEffect = DashPathEffect(floatArrayOf(20f, 15f), 0f)
              }

              private val paintText = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = Color.WHITE
                  textSize = 24f
                  typeface = Typeface.create(Typeface.MONOSPACE, Typeface.BOLD)
                  setShadowLayer(4f, 2f, 2f, Color.BLACK)
              }

              private val paintWarnBg = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = Color.parseColor("#CCBF360C")
                  style = Paint.Style.FILL
              }

              private val paintWarnText = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = Color.WHITE
                  textSize = 23f
                  typeface = Typeface.create(Typeface.DEFAULT, Typeface.BOLD)
              }

              private val paintDevSignature = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = Color.parseColor("#DD00E676")
                  textSize = 21f
                  typeface = Typeface.create(Typeface.DEFAULT, Typeface.BOLD)
                  setShadowLayer(4f, 2f, 2f, Color.BLACK)
              }

              private var lastTouchX = 0f
              private var lastTouchY = 0f

              override fun onTouchEvent(event: MotionEvent): Boolean {
                  when (event.actionMasked) {
                      MotionEvent.ACTION_DOWN -> {
                          lastTouchX = event.x
                          lastTouchY = event.y
                          return true
                      }
                      MotionEvent.ACTION_MOVE -> {
                          val dx = event.x - lastTouchX
                          val dy = event.y - lastTouchY
                          lastTouchX = event.x
                          lastTouchY = event.y

                          val effHFov = baseHorizontalFov / currentZoomRatio
                          val effVFov = baseVerticalFov / currentZoomRatio

                          // Yatay kalibrasyon kilitliyse pusula ofseti kazara değiştirilemez; sadece dikey ince ayar yapılır
                          val dAz = if (isHorizontalCalLocked) 0f else -(dx / width.toFloat()) * effHFov
                          val dPitch = (dy / height.toFloat()) * effVFov
                          onManualCalibrate(dAz, dPitch)
                          invalidate()
                          return true
                      }
                  }
                  return super.onTouchEvent(event)
              }

              override fun onDraw(canvas: Canvas) {
                  super.onDraw(canvas)
                  val w = width.toFloat()
                  val h = height.toFloat()
                  val cx = w / 2f
                  val cy = h / 2f

                  val effHFov = baseHorizontalFov / currentZoomRatio
                  val effVFov = baseVerticalFov / currentZoomRatio

                  if (horizonProfile.isNotEmpty()) {
                      val path = Path()
                      var first = true

                      for (pt in horizonProfile) {
                          var deltaAz = pt.azimuthDeg - currentAzimuth
                          if (deltaAz > 180f) deltaAz -= 360f
                          if (deltaAz < -180f) deltaAz += 360f

                          if (abs(deltaAz) <= effHFov / 1.8f) {
                              val x = cx + (deltaAz / effHFov) * w
                              val yHorizon = cy - ((pt.maxPitchDeg - currentPitch) / effVFov) * h

                              if (first) {
                                  path.moveTo(x, yHorizon)
                                  first = false
                              } else {
                                  path.lineTo(x, yHorizon)
                              }

                              for (contour in pt.contourLayers) {
                                  val yContour = cy - ((contour.first - currentPitch) / effVFov) * h
                                  if (yContour in 0f..h) {
                                      canvas.drawCircle(x, yContour, 2.5f, paintContour)
                                  }
                              }
                          }
                      }
                      canvas.drawPath(path, paintHorizon)
                  }

                  // Görsel Hata Denetimi: Yatay kalibrasyon yapılmışsa Ham Pusula (0° Ofset) dikey referans hattını çiz
                  if (abs(manualAzimuthOffset) > 0.15f) {
                      var deltaRaw = rawAzimuth - currentAzimuth
                      if (deltaRaw > 180f) deltaRaw -= 360f
                      if (deltaRaw < -180f) deltaRaw += 360f

                      if (abs(deltaRaw) <= effHFov / 1.8f) {
                          val rawX = cx + (deltaRaw / effHFov) * w
                          canvas.drawLine(rawX, 155f, rawX, h - 165f, paintRawZeroLine)
                          val labelX = (rawX + 10f).coerceAtMost(w - 280f)
                          canvas.drawText("HAM PUSULA (0°)", labelX, cy - 90f, paintRawZeroText)
                          canvas.drawText(
                              String.format(Locale.US, "KAL. FARK: %+.1f°", manualAzimuthOffset),
                              labelX,
                              cy - 62f,
                              paintRawZeroText
                          )
                      } else {
                          canvas.drawText(
                              String.format(Locale.US, "YATAY KAL. FARKI EKRAN DIŞI (%+.1f°)", manualAzimuthOffset),
                              cx - 240f,
                              cy - 95f,
                              paintRawZeroText
                          )
                      }
                  }

                  secondObserverRay?.let { obs2 ->
                      val meanLatRad = Math.toRadians((observerLat + obs2.lat) * 0.5)
                      val mLat = 111132.92
                      val mLon = 111412.84 * cos(meanLatRad)
                      val az2Rad = Math.toRadians(obs2.azimuth)
                      val pitch2Rad = Math.toRadians(obs2.pitch)

                      val rayPath = Path()
                      var started = false
                      var d = 500.0
                      while (d <= 30000.0) {
                          val pLat = obs2.lat + (d * cos(az2Rad)) / mLat
                          val pLon = obs2.lon + (d * sin(az2Rad)) / mLon
                          val pAlt = obs2.alt + d * tan(pitch2Rad)

                          val dxEast = (pLon - observerLon) * mLon
                          val dyNorth = (pLat - observerLat) * mLat
                          val distToUs = hypot(dxEast, dyNorth)

                          if (distToUs > 50.0) {
                              val azFromUs = (Math.toDegrees(atan2(dxEast, dyNorth)).toFloat() + 360f) % 360f
                              val pitchFromUs = Math.toDegrees(atan2(pAlt - observerAlt, distToUs)).toFloat()

                              var dAz = azFromUs - currentAzimuth
                              if (dAz > 180f) dAz -= 360f
                              if (dAz < -180f) dAz += 360f

                              val sx = cx + (dAz / effHFov) * w
                              val sy = cy - ((pitchFromUs - currentPitch) / effVFov) * h
                              if (!started) {
                                  rayPath.moveTo(sx, sy)
                                  started = true
                              } else {
                                  rayPath.lineTo(sx, sy)
                              }
                          }
                          d += 500.0
                      }
                      canvas.drawPath(rayPath, paintSecondRay)
                  }

                  canvas.drawCircle(cx, cy, 38f, paintCrosshair)
                  canvas.drawLine(cx - 65f, cy, cx - 15f, cy, paintCrosshair)
                  canvas.drawLine(cx + 15f, cy, cx + 65f, cy, paintCrosshair)
                  canvas.drawLine(cx, cy - 65f, cx, cy - 15f, paintCrosshair)
                  canvas.drawLine(cx, cy + 15f, cx, cy + 65f, paintCrosshair)

                  val lockTag = if (isHorizontalCalLocked) "KİLİTLİ" else "SERBEST"
                  val offsetTag = if (abs(manualAzimuthOffset) > 0.1f) {
                      String.format(Locale.US, " (%+.1f°)", manualAzimuthOffset)
                  } else ""

                  val hud1 = String.format(
                      Locale.US,
                      "AZİMUT: %.1f°%s | EĞİM: %.1f° | ZOOM: %.1fx | KULE: %.0fm | MANYETİK: %.0fµT | YATAY: %s",
                      currentAzimuth, offsetTag, currentPitch, currentZoomRatio, observerAlt, magneticFieldUt, lockTag
                  )
                  canvas.drawText(hud1, 24f, 40f, paintText)

                  val hit = currentHit
                  if (hit != null) {
                      val modeTag = if (hit.isTriangulated) "[KESTİRME]" else "[ARAZİ]"
                      val hud2 = String.format(
                          Locale.US,
                          "%s HEDEF: %.5f, %.5f | MESAFE: %.0fm (±%.0fm) | RAKIM: %.0fm",
                          modeTag, hit.hitLat, hit.hitLon, hit.distanceMeters, hit.radialErrorMeters, hit.hitEle
                      )
                      paintText.color = Color.parseColor("#00FF66")
                      canvas.drawText(hud2, 24f, 76f, paintText)
                      paintText.color = Color.WHITE
                  } else {
                      paintText.color = Color.YELLOW
                      canvas.drawText("HEDEF: Nişangah 30 km içinde araziye temas etmiyor (Ufuk üstü)", 24f, 76f, paintText)
                      paintText.color = Color.WHITE
                  }

                  if (isMagneticAnomaly) {
                      val bannerTop = 92f
                      val bannerBottom = 136f
                      canvas.drawRect(24f, bannerTop, w - 24f, bannerBottom, paintWarnBg)
                      val warnMsg = String.format(
                          Locale.US,
                          "UYARI: Manyetik Parazit (%.0f µT / Beklenen %.0f µT) - Metalden uzaklaşın veya yer değiştirin!",
                          magneticFieldUt, expectedFieldUt
                      )
                      canvas.drawText(warnMsg, 38f, bannerTop + 31f, paintWarnText)
                  }

                  // Geliştirici ve aktif personel imzası (alt kontrol çubuğuyla çakışmayacak güvenli yükseklikte)
                  val sigY = max(175f, h - 148f)
                  canvas.drawText("Geliştirici: Cihan Türkmen | $activeUserLabel", 24f, sigY, paintDevSignature)
              }
          }
          EOF

          # 14. MainActivity.kt (Manyetik Anomali Yönlendirmesi + Yatay Kilit + Bilinen Nokta Kalibrasyonu + İkili Güzergah KML)

                  </Point>
              </Placemark>

              <Placemark>
                  <name>1. Bakış Hattı (${String.format(Locale.US, "%.0f", hit.distanceMeters)} m)</name>
                  <Style><LineStyle><color>ff0000ff</color><width>3</width></LineStyle></Style>
                  <LineString>
                      <altitudeMode>absolute</altitudeMode>
                      <coordinates>
                          ${obs1.lon},${obs1.lat},${obs1.alt}

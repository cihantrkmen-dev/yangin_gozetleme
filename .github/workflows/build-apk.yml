name: Tek Dosyadan Tam Otomatik APK Derleyici

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu Hazirla
        uses: actions/checkout@v5

      - name: JDK 17 Kurulumu
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Android SDK Lisans ve Paket Kurulumu
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Gradle 8.7 Kurulumu
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Tum Proje Dosyalarini ve Kaynak Kodlarini Olustur
        run: |
          mkdir -p app/src/main/java/tr/gov/ogm/gozetleme
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/assets/dem

          # Özel Dijital İmza Anahtarı (Release Keystore) Oluştur
          rm -f app/ogm-release.keystore
          keytool -genkeypair -v \
            -keystore app/ogm-release.keystore \
            -alias ogm_cihan \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass CihanOgm2026! -keypass CihanOgm2026! \
            -dname "CN=Cihan Turkmen, OU=OGM, O=Orman Genel Mudurlugu, L=Denizli, S=Denizli, C=TR"

          # 1. settings.gradle
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "GozetlemeKamerasi"
          include ':app'
          EOF

          # 2. gradle.properties ve root build.gradle
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2560m -Dfile.encoding=UTF-8
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.3.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          # 3. ProGuard / R8 Kod Gizleme ve Koruma Kuralları
          cat << 'EOF' > app/proguard-rules.pro
          -optimizationpasses 5
          -dontusemixedcaseclassnames
          -dontskipnonpubliclibraryclasses
          -verbose
          -repackageclasses 'o'
          -allowaccessmodification
          -keepattributes *Annotation*
          -keep public class tr.gov.ogm.gozetleme.AuthActivity
          -keep public class tr.gov.ogm.gozetleme.MainActivity
          -dontwarn androidx.camera.**
          -keep class androidx.camera.** { *; }
          EOF

          # 4. app/build.gradle
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'tr.gov.ogm.gozetleme'
              compileSdk 34

              defaultConfig {
                  applicationId "tr.gov.ogm.gozetleme"
                  minSdk 26
                  targetSdk 34
                  versionCode 9
                  versionName "2.2-SafeNavPro"
              }

              signingConfigs {
                  release {
                      storeFile file("ogm-release.keystore")
                      storePassword "CihanOgm2026!"
                      keyAlias "ogm_cihan"
                      keyPassword "CihanOgm2026!"
                  }
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled true
                      shrinkResources true
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
                  debug {
                      signingConfig signingConfigs.release
                  }
              }

              androidResources {
                  noCompress 'hgt'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'

              def camerax_version = "1.3.2"
              implementation "androidx.camera:camera-core:${camerax_version}"
              implementation "androidx.camera:camera-camera2:${camerax_version}"
              implementation "androidx.camera:camera-lifecycle:${camerax_version}"
              implementation "androidx.camera:camera-view:${camerax_version}"
          }
          EOF

          # 5. file_paths.xml
          cat << 'EOF' > app/src/main/res/xml/file_paths.xml
          <?xml version="1.0" encoding="utf-8"?>
          <paths>
              <cache-path name="kml_exports" path="kml/" />
              <files-path name="custom_dem" path="dem/" />
          </paths>
          EOF

          # 6. Dürbün Uygulama Simgesi
          cat << 'EOF' > app/src/main/res/drawable/ic_binoculars.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path
                  android:fillColor="#1B5E20"
                  android:pathData="M0,0h24v24H0z"/>
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M15,4c-1.1,0 -2,0.9 -2,2v1H6V6c0,-1.1 -0.9,-2 -2,-2s-2,0.9 -2,2v12c0,1.1 0.9,2 2,2s2,-0.9 2,-2v-1h7v1c0,1.1 0.9,2 2,2s2,-0.9 2,-2V6c0,-1.1 -0.9,-2 -2,-2zM6,9h3v6H6V9zM15,15h-3V9h3V15z"/>
          </vector>
          EOF

          # 7. AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-feature android:name="android.hardware.camera" android:required="true" />
              <uses-feature android:name="android.hardware.sensor.accelerometer" android:required="true" />
              <uses-feature android:name="android.hardware.sensor.compass" android:required="true" />
              <uses-feature android:name="android.hardware.location.gps" android:required="true" />

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.HIGH_SAMPLING_RATE_SENSORS" />

              <application
                  android:allowBackup="false"
                  android:label="OGM Gözetleme CBS"
                  android:icon="@drawable/ic_binoculars"
                  android:roundIcon="@drawable/ic_binoculars"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.MaterialComponents.DayNight.NoActionBar">

                  <activity
                      android:name=".AuthActivity"
                      android:exported="true"
                      android:screenOrientation="portrait"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <activity
                      android:name=".MainActivity"
                      android:exported="false"
                      android:screenOrientation="landscape"
                      android:configChanges="orientation|screenSize|keyboardHidden" />

                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="${applicationId}.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths" />
                  </provider>
              </application>
          </manifest>
          EOF

          # 8. SecurityManager.kt (Tek Talep Kodundan Deterministik Lisans Üretimi + Yönetici Hızlı Aktivasyon)
          cat << 'EOF' > app/src/main/java/tr/gov/ogm/gozetleme/SecurityManager.kt
          package tr.gov.ogm.gozetleme

          import android.content.Context
          import android.util.Base64
          import java.security.MessageDigest
          import java.util.Locale

          object SecurityManager {
              private const val PREF_NAME = "ogm_sec_vault_v4"

              private fun getSecretSalt1(): String {
                  val data = intArrayOf(76, 87, 94, 72, 71, 89, 124, 99, 108, 121, 102, 100, 108, 103, 59, 57, 59, 63)
                  return data.map { (it xor 9).toChar() }.joinToString("")
              }

              private fun getSecretSalt2(): String {
                  val data = intArrayOf(80, 68, 78, 86, 84, 75, 104, 114, 103, 123, 110, 50, 48, 50, 54, 42)
                  return data.map { (it xor 11).toChar() }.joinToString("")
              }

              fun sha256(input: String): String {
                  val bytes = MessageDigest.getInstance("SHA-256").digest(input.toByteArray(Charsets.UTF_8))
                  return bytes.joinToString("") { "%02X".format(it) }
              }

              fun generateRequestCode(username: String, fullName: String, dutyPlace: String, phone: String): String {
                  val normalized = "${username.trim().lowercase(Locale.US)}|${fullName.trim().lowercase(Locale.US)}|${dutyPlace.trim().lowercase(Locale.US)}|${phone.trim()}|${getSecretSalt1()}"
                  val hash = sha256(normalized)
                  return "TALEP-${hash.substring(0, 4)}-${hash.substring(4, 8)}"
              }

              // Yönetici panelinde sadece TALEP-XXXX-XXXX girilerek hatasız lisans anahtarı üretilir
              fun generateLicenseFromRequestCode(requestCode: String): String {
                  val cleanReq = requestCode.trim().uppercase(Locale.US)
                  val hash = sha256("$cleanReq|${getSecretSalt2()}")
                  return "OGM-${hash.substring(0, 4)}-${hash.substring(4, 8)}"
              }

              private fun obfuscate(text: String): String {
                  val key = getSecretSalt1().toByteArray()
                  val input = text.toByteArray(Charsets.UTF_8)
                  val out = ByteArray(input.size)
                  for (i in input.indices) {
                      out[i] = (input[i].toInt() xor key[i % key.size].toInt()).toByte()
                  }
                  return Base64.encodeToString(out, Base64.NO_WRAP)
              }

              private fun deobfuscate(encoded: String): String {
                  return try {
                      val key = getSecretSalt1().toByteArray()
                      val input = Base64.decode(encoded, Base64.NO_WRAP)
                      val out = ByteArray(input.size)
                      for (i in input.indices) {
                          out[i] = (input[i].toInt() xor key[i % key.size].toInt()).toByte()
                      }
                      String(out, Charsets.UTF_8)
                  } catch (e: Exception) {
                      ""
                  }
              }

              fun saveUserRegistration(
                  context: Context,
                  fullName: String,
                  dutyPlace: String,
                  phone: String,
                  username: String,
                  pass: String
              ): Pair<String, String> {
                  val requestCode = generateRequestCode(username, fullName, dutyPlace, phone)
                  val license = generateLicenseFromRequestCode(requestCode)
                  val prefs = context.getSharedPreferences(PREF_NAME, Context.MODE_PRIVATE)
                  prefs.edit()
                      .putString("u_name", obfuscate(username.trim()))
                      .putString("u_pass", sha256(pass.trim() + getSecretSalt1()))
                      .putString("u_full", obfuscate(fullName.trim()))
                      .putString("u_duty", obfuscate(dutyPlace.trim()))
                      .putString("u_phone", obfuscate(phone.trim()))
                      .putString("u_expected_lic", sha256(license))
                      .putString("u_req_code", requestCode)
                      .putBoolean("u_activated", false)
                      .apply()
                  return Pair(license, requestCode)
              }

              fun activateAdminDeviceDirectly(context: Context) {
                  val prefs = context.getSharedPreferences(PREF_NAME, Context.MODE_PRIVATE)
                  prefs.edit()
                      .putString("u_name", obfuscate("cihan"))
                      .putString("u_pass", sha256("Cihan2026!" + getSecretSalt1()))
                      .putString("u_full", obfuscate("Cihan Türkmen"))
                      .putString("u_duty", obfuscate("Yönetici / Geliştirici"))
                      .putString("u_phone", obfuscate("Yönetici"))
                      .putBoolean("u_activated", true)
                      .apply()
              }

              fun verifyAndActivateLicense(context: Context, inputKey: String): Boolean {
                  val prefs = context.getSharedPreferences(PREF_NAME, Context.MODE_PRIVATE)
                  val expectedHash = prefs.getString("u_expected_lic", "") ?: ""
                  val cleanInput = inputKey.trim().uppercase(Locale.US)
                  if (expectedHash.isNotEmpty() && sha256(cleanInput) == expectedHash) {
                      prefs.edit().putBoolean("u_activated", true).apply()
                      return true
                  }
                  return false
              }

              fun validateLogin(context: Context, username: String, pass: String): Pair<Boolean, String> {
                  val prefs = context.getSharedPreferences(PREF_NAME, Context.MODE_PRIVATE)
                  val savedUser = deobfuscate(prefs.getString("u_name", "") ?: "")
                  val savedPassHash = prefs.getString("u_pass", "") ?: ""
                  val activated = prefs.getBoolean("u_activated", false)

                  if (savedUser.isEmpty()) {
                      return Pair(false, "Kayıtlı kullanıcı bulunamadı. Lütfen önce kayıt olun.")
                  }
                  if (!savedUser.equals(username.trim(), ignoreCase = true) ||
                      savedPassHash != sha256(pass.trim() + getSecretSalt1())) {
                      return Pair(false, "Kullanıcı adı veya şifre hatalı!")
                  }
                  if (!activated) {
                      return Pair(false, "Hesabınız henüz lisans kodu ile aktifleştirilmemiş!")
                  }
                  return Pair(true, "Giriş Başarılı")
              }

              fun isActivated(context: Context): Boolean {
                  val prefs = context.getSharedPreferences(PREF_NAME, Context.MODE_PRIVATE)
                  return prefs.getBoolean("u_activated", false)
              }

              fun getActiveUserSummary(context: Context): String {
                  val prefs = context.getSharedPreferences(PREF_NAME, Context.MODE_PRIVATE)
                  val full = deobfuscate(prefs.getString("u_full", "") ?: "")
                  val duty = deobfuscate(prefs.getString("u_duty", "") ?: "")
                  return if (full.isNotEmpty()) "$full ($duty)" else "OGM Personeli"
              }
          }
          EOF

          # 9. AuthActivity.kt (Gizli Yönetici Paneli - Tek Kodla Üretim + Hızlı Aktivasyon)
          cat << 'EOF' > app/src/main/java/tr/gov/ogm/gozetleme/AuthActivity.kt
          package tr.gov.ogm.gozetleme

          import android.app.AlertDialog
          import android.content.ClipData
          import android.content.ClipboardManager
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.Typeface
          import android.net.Uri
          import android.os.Bundle
          import android.text.InputType
          import android.view.Gravity
          import android.widget.*
          import androidx.appcompat.app.AppCompatActivity

          class AuthActivity : AppCompatActivity() {

              private lateinit var containerLayout: LinearLayout
              private var devClickCount = 0

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val scroll = ScrollView(this).apply {
                      isFillViewport = true
                      setBackgroundColor(Color.parseColor("#102015"))
                  }

                  containerLayout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER_HORIZONTAL
                      setPadding(56, 72, 56, 56)
                  }

                  scroll.addView(containerLayout)
                  setContentView(scroll)

                  showLoginView()
              }

              private fun buildHeader(subtitle: String) {
                  containerLayout.removeAllViews()

                  val title = TextView(this).apply {
                      text = "OGM GÖZETLEME CBS"
                      textSize = 26f
                      setTextColor(Color.parseColor("#00E676"))
                      typeface = Typeface.DEFAULT_BOLD
                      gravity = Gravity.CENTER
                  }

                  val sub = TextView(this).apply {
                      text = subtitle
                      textSize = 15f
                      setTextColor(Color.parseColor("#B0BEC5"))
                      gravity = Gravity.CENTER
                      setPadding(0, 12, 0, 44)
                  }

                  containerLayout.addView(title)
                  containerLayout.addView(sub)
              }

              private fun buildFooter() {
                  val devInfo = TextView(this).apply {
                      text = "Geliştirici: Cihan Türkmen\nDenizli Orman Bölge Müdürlüğü © 2026"
                      textSize = 13f
                      setTextColor(Color.parseColor("#81C784"))
                      typeface = Typeface.DEFAULT_BOLD
                      gravity = Gravity.CENTER
                      setPadding(0, 64, 0, 16)
                      setOnClickListener {
                          devClickCount++
                          if (devClickCount >= 5) {
                              devClickCount = 0
                              showAdminLoginDialog()
                          }
                      }
                  }
                  containerLayout.addView(devInfo)
              }

              private fun showAdminLoginDialog() {
                  val input = EditText(this).apply {
                      hint = "Yönetici Şifresi"
                      inputType = InputType.TYPE_CLASS_TEXT or InputType.TYPE_TEXT_VARIATION_PASSWORD
                      setPadding(40, 30, 40, 30)
                  }
                  AlertDialog.Builder(this)
                      .setTitle("Cihan Türkmen - Yönetici Modu")
                      .setMessage("Yönetici şifresini girin:")
                      .setView(input)
                      .setPositiveButton("Giriş Yap") { _, _ ->
                          if (input.text.toString() == "Cihan2026!") {
                              showAdminLicenseGeneratorPanel()
                          } else {
                              Toast.makeText(this, "Hatalı yönetici şifresi!", Toast.LENGTH_SHORT).show()
                          }
                      }
                      .setNegativeButton("İptal", null)
                      .show()
              }

              private fun showAdminLicenseGeneratorPanel() {
                  val layout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(40, 30, 40, 30)
                  }

                  val info = TextView(this).apply {
                      text = "E-postadaki Talep Kodunu girin (Örn: TALEP-7A3F-91C2):"
                      setPadding(0, 0, 0, 16)
                  }
                  val etReqCode = EditText(this).apply {
                      hint = "TALEP-XXXX-XXXX"
                  }

                  layout.addView(info)
                  layout.addView(etReqCode)

                  AlertDialog.Builder(this)
                      .setTitle("Yönetici Lisans Üretici")
                      .setView(layout)
                      .setPositiveButton("Lisans Kodu Üret") { _, _ ->
                          val req = etReqCode.text.toString().trim()
                          if (req.startsWith("TALEP-", ignoreCase = true) && req.length >= 10) {
                              val lic = SecurityManager.generateLicenseFromRequestCode(req)
                              AlertDialog.Builder(this)
                                  .setTitle("Onaylanan Lisans Kodu")
                                  .setMessage("Talep: ${req.uppercase()}\n\nAktivasyon Kodu:\n$lic")
                                  .setPositiveButton("Kopyala") { _, _ ->
                                      val clipboard = getSystemService(CLIPBOARD_SERVICE) as ClipboardManager
                                      clipboard.setPrimaryClip(ClipData.newPlainText("OGM Lisans", lic))
                                      Toast.makeText(this, "Lisans kodu kopyalandı!", Toast.LENGTH_SHORT).show()
                                  }
                                  .setNeutralButton("Paylaş") { _, _ ->
                                      val share = Intent(Intent.ACTION_SEND).apply {
                                          type = "text/plain"
                                          putExtra(Intent.EXTRA_TEXT, "OGM Gözetleme CBS Aktivasyon Kodunuz: $lic")
                                      }
                                      startActivity(Intent.createChooser(share, "Lisans Kodunu Gönder"))
                                  }
                                  .show()
                          } else {
                              Toast.makeText(this, "Lütfen geçerli bir TALEP-XXXX-XXXX kodu girin!", Toast.LENGTH_LONG).show()
                          }
                      }
                      .setNeutralButton("Bu Cihazı Aktifleştir") { _, _ ->
                          SecurityManager.activateAdminDeviceDirectly(this)
                          Toast.makeText(this, "Yönetici cihazı aktifleştirildi!", Toast.LENGTH_SHORT).show()
                          startActivity(Intent(this, MainActivity::class.java))
                          finish()
                      }
                      .setNegativeButton("Kapat", null)
                      .show()
              }

              private fun createStyledInput(hintText: String, isPassword: Boolean = false, isPhone: Boolean = false): EditText {
                  return EditText(this).apply {
                      hint = hintText
                      setHintTextColor(Color.parseColor("#78909C"))
                      setTextColor(Color.WHITE)
                      setBackgroundColor(Color.parseColor("#1E3324"))
                      setPadding(36, 32, 36, 32)
                      inputType = when {
                          isPassword -> InputType.TYPE_CLASS_TEXT or InputType.TYPE_TEXT_VARIATION_PASSWORD
                          isPhone -> InputType.TYPE_CLASS_PHONE
                          else -> InputType.TYPE_CLASS_TEXT
                      }
                  }
              }

              private fun showLoginView() {
                  buildHeader("Yangın Gözetleme ve Arazi Çakıştırma Sistemi")

                  val lp = LinearLayout.LayoutParams(
                      LinearLayout.LayoutParams.MATCH_PARENT,
                      LinearLayout.LayoutParams.WRAP_CONTENT
                  ).apply { setMargins(0, 16, 0, 16) }

                  val etUser = createStyledInput("Kullanıcı Adı")
                  val etPass = createStyledInput("Şifre", isPassword = true)

                  val btnLogin = Button(this).apply {
                      text = "GİRİŞ YAP"
                      setBackgroundColor(Color.parseColor("#2E7D32"))
                      setTextColor(Color.WHITE)
                      textSize = 16f
                      setPadding(0, 28, 0, 28)
                      setOnClickListener {
                          val (ok, msg) = SecurityManager.validateLogin(
                              this@AuthActivity,
                              etUser.text.toString(),
                              etPass.text.toString()
                          )
                          if (ok) {
                              startActivity(Intent(this@AuthActivity, MainActivity::class.java))
                              finish()
                          } else {
                              Toast.makeText(this@AuthActivity, msg, Toast.LENGTH_LONG).show()
                          }
                      }
                  }

                  val btnRegister = Button(this).apply {
                      text = "YENİ KULLANICI EKLE / KAYIT OL"
                      setBackgroundColor(Color.parseColor("#0277BD"))
                      setTextColor(Color.WHITE)
                      setOnClickListener { showRegisterView() }
                  }

                  val btnActivate = Button(this).apply {
                      text = "LİSANS AKTİVASYON KODU GİR"
                      setBackgroundColor(Color.parseColor("#455A64"))
                      setTextColor(Color.WHITE)
                      setOnClickListener { showLicenseActivationDialog() }
                  }

                  containerLayout.addView(etUser, lp)
                  containerLayout.addView(etPass, lp)
                  containerLayout.addView(btnLogin, lp)
                  containerLayout.addView(btnRegister, lp)
                  containerLayout.addView(btnActivate, lp)

                  buildFooter()
              }

              private fun showRegisterView() {
                  buildHeader("Yeni Kullanıcı Kaydı ve Lisans Talebi")

                  val lp = LinearLayout.LayoutParams(
                      LinearLayout.LayoutParams.MATCH_PARENT,
                      LinearLayout.LayoutParams.WRAP_CONTENT
                  ).apply { setMargins(0, 12, 0, 12) }

                  val etFullName = createStyledInput("Ad Soyad (Örn: Ahmet Yılmaz)")
                  val etDutyPlace = createStyledInput("Görev Yeri (Örn: Denizli OBM - Akdağ Kulesi)")
                  val etPhone = createStyledInput("İletişim Telefon Numarası (05XX...)", isPhone = true)
                  val etUsername = createStyledInput("Belirleyeceğiniz Kullanıcı Adı")
                  val etPassword = createStyledInput("Belirleyeceğiniz Şifre", isPassword = true)

                  val btnSubmit = Button(this).apply {
                      text = "KAYDET VE LİSANS TALEBİ GÖNDER"
                      setBackgroundColor(Color.parseColor("#D32F2F"))
                      setTextColor(Color.WHITE)
                      textSize = 15f
                      setOnClickListener {
                          val full = etFullName.text.toString().trim()
                          val duty = etDutyPlace.text.toString().trim()
                          val phone = etPhone.text.toString().trim()
                          val user = etUsername.text.toString().trim()
                          val pass = etPassword.text.toString().trim()

                          if (full.isEmpty() || duty.isEmpty() || phone.isEmpty() || user.isEmpty() || pass.isEmpty()) {
                              Toast.makeText(this@AuthActivity, "Lütfen tüm bilgileri eksiksiz doldurun!", Toast.LENGTH_LONG).show()
                              return@setOnClickListener
                          }

                          val (_, requestCode) = SecurityManager.saveUserRegistration(
                              this@AuthActivity, full, duty, phone, user, pass
                          )

                          sendRequestEmailToAdmin(full, duty, phone, user, requestCode)
                      }
                  }

                  val btnBack = Button(this).apply {
                      text = "GİRİŞ EKRANINA DÖN"
                      setBackgroundColor(Color.parseColor("#37474F"))
                      setTextColor(Color.WHITE)
                      setOnClickListener { showLoginView() }
                  }

                  containerLayout.addView(etFullName, lp)
                  containerLayout.addView(etDutyPlace, lp)
                  containerLayout.addView(etPhone, lp)
                  containerLayout.addView(etUsername, lp)
                  containerLayout.addView(etPassword, lp)
                  containerLayout.addView(btnSubmit, lp)
                  containerLayout.addView(btnBack, lp)

                  buildFooter()
              }


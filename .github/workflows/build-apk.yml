                  "Bolu & Kastamonu & Zonguldak OBM" to listOf("N40E031", "N41E031", "N41E032", "N41E033", "N41E034")
              )

              fun formatTileKey(latFloor: Int, lonFloor: Int): String {
                  val ns = if (latFloor >= 0) "N" else "S"
                  val ew = if (lonFloor >= 0) "E" else "W"
                  return String.format("%s%02d%s%03d", ns, abs(latFloor), ew, abs(lonFloor))
              }

              fun isTileAvailable(lat: Double, lon: Double): Boolean {
                  val key = formatTileKey(floor(lat).toInt(), floor(lon).toInt())
                  if (mappedTiles.containsKey(key)) return true
                  val localFile = File(File(context.filesDir, "dem"), "$key.hgt")
                  if (localFile.exists() && localFile.length() > 1000000) return true
                  return try {
                      context.assets.open("dem/$key.hgt").close()
                      true
                  } catch (e: Exception) {
                      false
                  }
              }

              // Derece sınırlarına (kuzey/güney/doğu/batı) yakınlık kontrolü ile akıllı komşu pafta seçimi
              fun getSurroundingTilesForGps(lat: Double, lon: Double): List<String> {
                  val cLat = floor(lat).toInt()
                  val cLon = floor(lon).toInt()
                  val fracLat = lat - cLat
                  val fracLon = lon - cLon

                  val latOffsets = mutableListOf(0)
                  if (fracLat > 0.65) latOffsets.add(1)
                  if (fracLat < 0.35) latOffsets.add(-1)

                  val lonOffsets = mutableListOf(0)
                  if (fracLon > 0.65) lonOffsets.add(1)
                  if (fracLon < 0.35) lonOffsets.add(-1)

                  val list = ArrayList<String>()
                  for (dLat in latOffsets) {
                      for (dLon in lonOffsets) {
                          list.add(formatTileKey(cLat + dLat, cLon + dLon))
                      }
                  }
                  return list.distinct()
              }

              // Bilinen sabit bir kule/tepe referans noktasına gerçek coğrafi azimut ve mesafe hesabı
              fun calculateBearingAndPitch(
                  obsLat: Double,
                  obsLon: Double,
                  obsAlt: Double,
                  targetLat: Double,
                  targetLon: Double,
                  targetAltOverride: Double? = null
              ): Triple<Double, Double, Double> {
                  val meanLatRad = Math.toRadians((obsLat + targetLat) * 0.5)
                  val dNorth = (targetLat - obsLat) * 111132.92
                  val dEast = (targetLon - obsLon) * 111412.84 * cos(meanLatRad)
                  val dist = hypot(dEast, dNorth)
                  val bearingDeg = (Math.toDegrees(atan2(dEast, dNorth)) + 360.0) % 360.0

                  val targetEle = targetAltOverride ?: getElevation(targetLat, targetLon)
                  val curvatureDrop = (dist * dist) / (2.0 * earthRadius) * (1.0 - refractionK)
                  val effTargetEle = targetEle - curvatureDrop
                  val pitchDeg = if (dist > 1.0) Math.toDegrees(atan2(effTargetEle - obsAlt, dist)) else 0.0

                  return Triple(bearingDeg, pitchDeg, dist)
              }

              fun downloadTilesSync(tiles: List<String>, onProgress: (String) -> Unit): Int {
                  val localDir = File(context.filesDir, "dem")
                  if (!localDir.exists()) localDir.mkdirs()
                  var downloadedCount = 0

                  for ((index, tile) in tiles.withIndex()) {
                      val outFile = File(localDir, "$tile.hgt")
                      if (outFile.exists() && outFile.length() > 1000000) {
                          downloadedCount++
                          continue
                      }

                      onProgress("İndiriliyor (${index + 1}/${tiles.size}): $tile.hgt ...")
                      try {
                          val latDir = tile.substring(0, 3)
                          val url = URL("https://s3.amazonaws.com/elevation-tiles-prod/skadi/$latDir/$tile.hgt.gz")
                          val conn = (url.openConnection() as HttpURLConnection).apply {
                              connectTimeout = 15000
                              readTimeout = 30000
                              requestMethod = "GET"
                          }
                          if (conn.responseCode == 200) {
                              val tempFile = File(localDir, "$tile.tmp")
                              GZIPInputStream(conn.inputStream).use { gis ->
                                  FileOutputStream(tempFile).use { fos ->
                                      gis.copyTo(fos)
                                  }
                              }
                              if (tempFile.length() > 1000000) {
                                  tempFile.renameTo(outFile)
                                  mappedTiles.remove(tile)
                                  downloadedCount++
                              } else {
                                  tempFile.delete()
                              }
                          }
                          conn.disconnect()
                      } catch (e: Exception) {
                          // Devam et
                      }
                  }
                  return downloadedCount
              }

              private fun getTileBuffer(latFloor: Int, lonFloor: Int): MappedByteBuffer? {
                  val key = formatTileKey(latFloor, lonFloor)
                  if (mappedTiles.containsKey(key)) return mappedTiles[key]

                  return try {
                      val fileName = "$key.hgt"
                      val localDir = File(context.filesDir, "dem")
                      if (!localDir.exists()) localDir.mkdirs()
                      val outFile = File(localDir, fileName)

                      if (!outFile.exists()) {
                          context.assets.open("dem/$fileName").use { input ->
                              FileOutputStream(outFile).use { output ->
                                  input.copyTo(output)
                              }
                          }
                      }
                      val raf = RandomAccessFile(outFile, "r")
                      val channel = raf.channel
                      val buffer = channel.map(FileChannel.MapMode.READ_ONLY, 0, channel.size())
                      buffer.order(ByteOrder.BIG_ENDIAN)
                      mappedTiles[key] = buffer
                      buffer
                  } catch (e: Exception) {
                      null
                  }
              }

              fun getElevation(lat: Double, lon: Double): Double {
                  val latFloor = floor(lat).toInt()
                  val lonFloor = floor(lon).toInt()
                  val buf = getTileBuffer(latFloor, lonFloor) ?: return 0.0

                  val size = sqrt((buf.limit() / 2).toDouble()).roundToInt()
                  if (size < 1200) return 0.0
                  val intervals = size - 1

                  val u = (lat - latFloor) * intervals
                  val v = (lon - lonFloor) * intervals

                  val row0 = (intervals - floor(u).toInt()).coerceIn(0, intervals - 1)
                  val col0 = floor(v).toInt().coerceIn(0, intervals - 1)
                  val row1 = (row0 - 1).coerceIn(0, intervals)
                  val col1 = (col0 + 1).coerceIn(0, intervals)

                  val du = u - floor(u)
                  val dv = v - floor(v)

                  fun readSample(r: Int, c: Int): Double {
                      val idx = (r * size + c) * 2
                      val s = buf.getShort(idx).toInt()
                      return if (s < -1000) 0.0 else s.toDouble()
                  }

                  val h00 = readSample(row0, col0)
                  val h01 = readSample(row0, col1)
                  val h10 = readSample(row1, col0)
                  val h11 = readSample(row1, col1)

                  return h00 * (1 - du) * (1 - dv) +
                         h01 * (1 - du) * dv +
                         h10 * du * (1 - dv) +
                         h11 * du * dv
              }

              fun castRayToGround(
                  obsLat: Double,
                  obsLon: Double,
                  obsAlt: Double,
                  azimuthDeg: Double,
                  pitchDeg: Double,
                  azErrorDeg: Double = 0.5,
                  pitchErrorDeg: Double = 0.25,
                  maxDistMeters: Double = 30000.0
              ): RayHitResult? {
                  val azRad = Math.toRadians(azimuthDeg)
                  val pitchRad = Math.toRadians(pitchDeg)
                  val tanPitch = tan(pitchRad)

                  var prevDist = 20.0
                  var prevRayH = obsAlt
                  var prevTerrainH = getElevation(obsLat, obsLon)

                  var d = 30.0
                  val step = 15.0

                  while (d <= maxDistMeters) {
                      val (curLat, curLon) = projectCoordinate(obsLat, obsLon, azRad, d)
                      val rawTerrain = getElevation(curLat, curLon)

                      val curvatureDrop = (d * d) / (2.0 * earthRadius) * (1.0 - refractionK)
                      val effectiveTerrainH = rawTerrain - curvatureDrop
                      val rayH = obsAlt + d * tanPitch

                      if (rayH <= effectiveTerrainH) {
                          val denom = (prevRayH - prevTerrainH) - (rayH - effectiveTerrainH)
                          val frac = if (abs(denom) > 0.001) ((prevRayH - prevTerrainH) / denom).coerceIn(0.0, 1.0) else 0.5
                          val hitDist = prevDist + frac * (d - prevDist)
                          val (hitLat, hitLon) = projectCoordinate(obsLat, obsLon, azRad, hitDist)
                          val hitEle = getElevation(hitLat, hitLon)

                          val (aheadLat, aheadLon) = projectCoordinate(obsLat, obsLon, azRad, hitDist + 30.0)
                          val slopeRise = getElevation(aheadLat, aheadLon) - hitEle
                          val terrainSlopeRad = atan2(abs(slopeRise), 30.0)
                          val grazeAngle = max(Math.toRadians(2.0), abs(terrainSlopeRad - pitchRad))

                          val lateralErr = hitDist * tan(Math.toRadians(azErrorDeg))
                          val radialErr = (hitDist * Math.toRadians(pitchErrorDeg) / sin(grazeAngle)).coerceIn(25.0, 1200.0)

                          val poly = buildErrorPolygon(hitLat, hitLon, azRad, radialErr, lateralErr)

                          return RayHitResult(
                              hitLat = hitLat,
                              hitLon = hitLon,
                              hitEle = hitEle,
                              distanceMeters = hitDist,
                              slopeDeg = Math.toDegrees(terrainSlopeRad),
                              radialErrorMeters = radialErr,
                              lateralErrorMeters = lateralErr,
                              polygonPoints = poly
                          )
                      }

                      prevDist = d
                      prevRayH = rayH
                      prevTerrainH = effectiveTerrainH
                      d += step
                  }
                  return null
              }

              fun triangulateTwoRays(
                  lat1: Double, lon1: Double, alt1: Double, az1Deg: Double, pitch1Deg: Double,
                  lat2: Double, lon2: Double, alt2: Double, az2Deg: Double, pitch2Deg: Double
              ): RayHitResult? {
                  val meanLatRad = Math.toRadians((lat1 + lat2) * 0.5)
                  val mPerDegLat = 111132.92
                  val mPerDegLon = 111412.84 * cos(meanLatRad)

                  val p2x = (lon2 - lon1) * mPerDegLon
                  val p2y = (lat2 - lat1) * mPerDegLat

                  val az1 = Math.toRadians(az1Deg)
                  val az2 = Math.toRadians(az2Deg)
                  val v1x = sin(az1)
                  val v1y = cos(az1)
                  val v2x = sin(az2)
                  val v2y = cos(az2)

                  val det = v1x * (-v2y) - v1y * (-v2x)
                  if (abs(det) < 1e-4) return null

                  val t1 = (p2x * (-v2y) - p2y * (-v2x)) / det
                  val t2 = (v1x * p2y - v1y * p2x) / det

                  if (t1 < 10.0 || t2 < 10.0 || t1 > 60000.0 || t2 > 60000.0) return null

                  val ix = t1 * v1x
                  val iy = t1 * v1y
                  val hitLon = lon1 + ix / mPerDegLon
                  val hitLat = lat1 + iy / mPerDegLat
                  val hitEle = getElevation(hitLat, hitLon)

                  val cosGamma = (v1x * v2x + v1y * v2y).coerceIn(-1.0, 1.0)
                  val gammaDeg = Math.toDegrees(acos(abs(cosGamma)))
                  val sinGamma = max(0.15, sin(Math.toRadians(gammaDeg)))

                  val baseErr = max(t1, t2) * tan(Math.toRadians(0.5)) / sinGamma
                  val poly = buildErrorPolygon(hitLat, hitLon, az1, baseErr, baseErr * 0.7)

                  return RayHitResult(
                      hitLat = hitLat,
                      hitLon = hitLon,
                      hitEle = hitEle,
                      distanceMeters = t1,
                      slopeDeg = 0.0,
                      radialErrorMeters = baseErr,
                      lateralErrorMeters = baseErr * 0.7,
                      polygonPoints = poly,
                      isTriangulated = true,
                      intersectionAngleDeg = gammaDeg
                  )
              }

              fun buildHorizonAndContours(
                  obsLat: Double,
                  obsLon: Double,
                  obsAlt: Double,
                  centerAzimuth: Float,
                  fovHorizontal: Float = 60f
              ): List<HorizonProfilePoint> {
                  val results = ArrayList<HorizonProfilePoint>()
                  val halfFov = fovHorizontal / 2f
                  val stepAz = 1.0f

                  var relAz = -halfFov
                  while (relAz <= halfFov) {
                      val az = (centerAzimuth + relAz + 360f) % 360f
                      val azRad = Math.toRadians(az.toDouble())

                      var maxPitch = -90.0f
                      var horizonDist = 0f
                      var horizonEle = 0f
                      val visibleContours = ArrayList<Pair<Float, Float>>()
                      var lastContourBand = -1

                      var d = 250.0
                      while (d <= 30000.0) {
                          val (lat, lon) = projectCoordinate(obsLat, obsLon, azRad, d)
                          val rawEle = getElevation(lat, lon)
                          val drop = (d * d) / (2.0 * earthRadius) * (1.0 - refractionK)
                          val effEle = rawEle - drop
                          val pitch = Math.toDegrees(atan2(effEle - obsAlt, d)).toFloat()

                          if (pitch > maxPitch) {
                              maxPitch = pitch
                              horizonDist = d.toFloat()
                              horizonEle = rawEle.toFloat()

                              val contourInterval = if (d < 8000.0) 50 else 100
                              val currentBand = (rawEle.toInt() / contourInterval) * contourInterval
                              if (currentBand != lastContourBand && rawEle > 100) {
                                  visibleContours.add(Pair(pitch, currentBand.toFloat()))
                                  lastContourBand = currentBand
                              }
                          }
                          d += if (d < 5000.0) 100.0 else if (d < 15000.0) 200.0 else 350.0
                      }

                      results.add(HorizonProfilePoint(az, maxPitch, horizonDist, horizonEle, visibleContours))
                      relAz += stepAz
                  }
                  return results
              }

              fun projectCoordinate(lat: Double, lon: Double, azRad: Double, distMeters: Double): Pair<Double, Double> {
                  val latRad = Math.toRadians(lat)
                  val dLat = (distMeters * cos(azRad)) / 111132.92
                  val dLon = (distMeters * sin(azRad)) / (111412.84 * cos(latRad))
                  return Pair(lat + dLat, lon + dLon)
              }

              private fun buildErrorPolygon(
                  centerLat: Double,
                  centerLon: Double,
                  azRad: Double,
                  radialErr: Double,
                  lateralErr: Double
              ): List<Pair<Double, Double>> {
                  val pts = ArrayList<Pair<Double, Double>>()
                  for (i in 0..8) {
                      val angle = (i * 2.0 * PI) / 8.0
                      val localForward = radialErr * cos(angle)
                      val localRight = lateralErr * sin(angle)
                      val dNorth = localForward * cos(azRad) - localRight * sin(azRad)
                      val dEast = localForward * sin(azRad) + localRight * cos(azRad)
                      val pLat = centerLat + dNorth / 111132.92
                      val pLon = centerLon + dEast / (111412.84 * cos(Math.toRadians(centerLat)))
                      pts.add(Pair(pLat, pLon))
                  }
                  return pts
              }
          }

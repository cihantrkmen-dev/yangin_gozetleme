          class DemEngine(private val context: Context) {
              private val mappedTiles = HashMap<String, MappedByteBuffer>()
              private val earthRadius = 6371000.0
              private val refractionK = 0.13

              val obmRegions: LinkedHashMap<String, List<String>> = linkedMapOf(
                  "Denizli OBM (Denizli - Uşak)" to listOf("N36E028", "N36E029", "N37E028", "N37E029", "N38E028", "N38E029"),

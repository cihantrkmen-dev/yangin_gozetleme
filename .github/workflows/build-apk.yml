          import java.io.File
          import java.util.Locale
          import java.util.concurrent.Executors
          import kotlin.math.abs

          class MainActivity : AppCompatActivity(), LocationListener {

              private lateinit var previewView: PreviewView
              private lateinit var arOverlay: ArOverlayView
              private lateinit var demEngine: DemEngine
              private lateinit var sensorFusion: SensorFusion
              private lateinit var btnLockCal: Button
              private lateinit var btnMagStatus: Button
              private var camera: Camera? = null

              private var currentLat = 37.4180
              private var currentLon = 29.2808
              private var towerHeightOffset = 12.0
              private var promptedForMissingGpsTile = false

              private var anomalyStartTimeMs = 0L
              private var lastAnomalyPromptMs = 0L
              private var isAnomalyDialogOpen = false

              private var lastRawHit: RayHitResult? = null
              private var lastProfileAzimuth = -999f
              private val bgExecutor = Executors.newSingleThreadExecutor()
              private val uiHandler = Handler(Looper.getMainLooper())

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  if (!SecurityManager.isActivated(this)) {
                      startActivity(Intent(this, AuthActivity::class.java))
                      finish()
                      return
                  }

                  demEngine = DemEngine(this)

                  val root = FrameLayout(this)
                  previewView = PreviewView(this)
                  root.addView(previewView, FrameLayout.LayoutParams(
                      FrameLayout.LayoutParams.MATCH_PARENT,
                      FrameLayout.LayoutParams.MATCH_PARENT
                  ))

                  arOverlay = ArOverlayView(this) { dAz, dPitch ->
                      sensorFusion.manualAzimuthOffset += dAz
                      sensorFusion.manualPitchOffset += dPitch
                      arOverlay.manualAzimuthOffset = sensorFusion.manualAzimuthOffset
                  }.apply {
                      activeUserLabel = SecurityManager.getActiveUserSummary(this@MainActivity)
                      isHorizontalCalLocked = true
                  }
                  root.addView(arOverlay, FrameLayout.LayoutParams(
                      FrameLayout.LayoutParams.MATCH_PARENT,
                      FrameLayout.LayoutParams.MATCH_PARENT
                  ))

                  val scaleDetector = ScaleGestureDetector(this, object : ScaleGestureDetector.SimpleOnScaleGestureListener() {
                      override fun onScale(detector: ScaleGestureDetector): Boolean {
                          val cam = camera ?: return false
                          val currentZoom = cam.cameraInfo.zoomState.value?.zoomRatio ?: 1f
                          val nextZoom = (currentZoom * detector.scaleFactor).coerceIn(1f, 10f)
                          cam.cameraControl.setZoomRatio(nextZoom)
                          arOverlay.currentZoomRatio = nextZoom
                          arOverlay.invalidate()
                          return true
                      }
                  })

                  arOverlay.setOnTouchListener { v, event ->
                      scaleDetector.onTouchEvent(event)
                      if (!scaleDetector.isInProgress) {
                          v.onTouchEvent(event)
                      }
                      true
                  }

                  val btnScroll = HorizontalScrollView(this).apply {
                      isHorizontalScrollBarEnabled = false
                  }

                  val btnPanel = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(12, 12, 12, 12)
                  }

                  fun styleControlBtn(btn: Button, bgHex: String) {
                      btn.setBackgroundColor(Color.parseColor(bgHex))
                      btn.setTextColor(Color.WHITE)
                      btn.textSize = 12f
                      btn.setPadding(20, 10, 20, 10)
                  }

                  btnMagStatus = Button(this).apply {
                      text = "Sensör: Normal"
                      styleControlBtn(this, "#CC2E7D32")
                      setOnClickListener { showMagneticGuidanceDialog() }
                  }

                  btnLockCal = Button(this).apply {
                      text = "Yatay: KİLİTLİ"
                      styleControlBtn(this, "#CC37474F")
                      setOnClickListener { toggleHorizontalCalibrationLock() }
                  }

                  val btnRefPoint = Button(this).apply {
                      text = "Ref. Nokta Kal."
                      styleControlBtn(this, "#CC6A1B9A")
                      setOnClickListener { showKnownReferenceDialog() }
                  }

                  val btnRegionMap = Button(this).apply {
                      text = "Bölge İndir"
                      styleControlBtn(this, "#CC1B5E20")
                      setOnClickListener { showRegionDownloadDialog() }
                  }

                  val btnTowerHeight = Button(this).apply {
                      text = "Kule +12m"
                      styleControlBtn(this, "#CC263238")
                      setOnClickListener { showTowerHeightDialog(this) }
                  }

                  val btnSecondRay = Button(this).apply {
                      text = "2. Kule"
                      styleControlBtn(this, "#CC0277BD")
                      setOnClickListener { showSecondRayDialog() }
                  }

                  val btnResetCal = Button(this).apply {
                      text = "Sıfırla"
                      styleControlBtn(this, "#CC455A64")
                      setOnClickListener {
                          sensorFusion.manualAzimuthOffset = 0f
                          sensorFusion.manualPitchOffset = 0f
                          arOverlay.manualAzimuthOffset = 0f
                          setHorizontalLockState(true)
                          Toast.makeText(this@MainActivity, "Kalibrasyon sıfırlandı ve yatay kilit kapatıldı", Toast.LENGTH_SHORT).show()
                      }
                  }

                  val btnFireKml = Button(this).apply {
                      text = "HEDEF KML ÜRET"
                      styleControlBtn(this, "#FFD32F2F")
                      setOnClickListener { exportAndShareKml() }
                  }

                  val lp = LinearLayout.LayoutParams(
                      LinearLayout.LayoutParams.WRAP_CONTENT,
                      LinearLayout.LayoutParams.WRAP_CONTENT
                  ).apply { setMargins(6, 0, 6, 0) }

                  btnPanel.addView(btnMagStatus, lp)
                  btnPanel.addView(btnLockCal, lp)
                  btnPanel.addView(btnRefPoint, lp)
                  btnPanel.addView(btnRegionMap, lp)
                  btnPanel.addView(btnTowerHeight, lp)
                  btnPanel.addView(btnSecondRay, lp)
                  btnPanel.addView(btnResetCal, lp)
                  btnPanel.addView(btnFireKml, lp)

                  btnScroll.addView(btnPanel)

                  val panelParams = FrameLayout.LayoutParams(
                      FrameLayout.LayoutParams.WRAP_CONTENT,
                      FrameLayout.LayoutParams.WRAP_CONTENT,
                      Gravity.BOTTOM or Gravity.END
                  )
                  root.addView(btnScroll, panelParams)

                  setContentView(root)

                  sensorFusion = SensorFusion(this) { az, rawAz, pitch, fieldUt, expectedUt, isAnomaly, reason ->
                      arOverlay.currentAzimuth = az
                      arOverlay.rawAzimuth = rawAz
                      arOverlay.manualAzimuthOffset = sensorFusion.manualAzimuthOffset
                      arOverlay.currentPitch = pitch
                      arOverlay.magneticFieldUt = fieldUt
                      arOverlay.expectedFieldUt = expectedUt
                      arOverlay.isMagneticAnomaly = isAnomaly
                      arOverlay.anomalyReason = reason

                      if (isAnomaly) {
                          btnMagStatus.text = "PARAZİT!"
                          btnMagStatus.setBackgroundColor(Color.parseColor("#FFD84315"))
                          val now = System.currentTimeMillis()
                          if (anomalyStartTimeMs == 0L) anomalyStartTimeMs = now
                          if (!isAnomalyDialogOpen && (now - anomalyStartTimeMs > 3500L) && (now - lastAnomalyPromptMs > 60000L)) {
                              lastAnomalyPromptMs = now
                              showMagneticGuidanceDialog()
                          }
                      } else {
                          anomalyStartTimeMs = 0L
                          btnMagStatus.text = "Sensör: Normal"
                          btnMagStatus.setBackgroundColor(Color.parseColor("#CC2E7D32"))
                      }

                      if (abs(az - lastProfileAzimuth) > 15f) {
                          lastProfileAzimuth = az
                          refreshHorizonAsync(az)
                      }
                      arOverlay.invalidate()
                  }

                  uiHandler.post(raycastLoop)

                  checkPermissionsAndStart()
              }

              private fun setHorizontalLockState(locked: Boolean) {
                  arOverlay.isHorizontalCalLocked = locked
                  if (locked) {
                      btnLockCal.text = "Yatay: KİLİTLİ"
                      btnLockCal.setBackgroundColor(Color.parseColor("#CC37474F"))
                  } else {
                      btnLockCal.text = "Yatay: SERBEST"
                      btnLockCal.setBackgroundColor(Color.parseColor("#CCE65100"))
                  }
                  arOverlay.invalidate()
              }

              private fun toggleHorizontalCalibrationLock() {
                  if (arOverlay.isHorizontalCalLocked) {
                      AlertDialog.Builder(this)
                          .setTitle("Yatay Kalibrasyon Kilidini Aç")
                          .setMessage(
                              "Yatay kaydırma pusula yönünü doğrudan değiştirir. Yalnızca bilinen bir tepe/kule referansına hizalama yapacaksanız açmanız önerilir.\n\n" +
                              "Ekranda turuncu kesikli çizgi ham pusula (0°) yönünü göstermeye devam edecektir."
                          )
                          .setPositiveButton("Kilidi Aç") { _, _ ->
                              setHorizontalLockState(false)
                              Toast.makeText(this, "Yatay kalibrasyon serbest bırakıldı. Hizalama bitince tekrar kilitleyin.", Toast.LENGTH_LONG).show()
                          }
                          .setNeutralButton("Ref. Nokta ile Hizala") { _, _ ->
                              showKnownReferenceDialog()
                          }
                          .setNegativeButton("Kilitli Kalsın", null)
                          .show()
                  } else {
                      setHorizontalLockState(true)
                      Toast.makeText(this, "Yatay kalibrasyon kilitlendi.", Toast.LENGTH_SHORT).show()
                  }
              }

              private fun showMagneticGuidanceDialog() {
                  if (isAnomalyDialogOpen) return
                  isAnomalyDialogOpen = true

                  val isBad = arOverlay.isMagneticAnomaly
                  val title = if (isBad) "Manyetik Parazit Tespit Edildi" else "Pusula ve Manyetik Alan Durumu"
                  val statusLine = String.format(
                      Locale.US,
                      "Ölçülen Alan: %.1f µT | Beklenen Yerel Alan: %.1f µT\nDurum: %s\n\n",
                      arOverlay.magneticFieldUt,
                      arOverlay.expectedFieldUt,
                      if (isBad) arOverlay.anomalyReason else "Sensör sağlıklı ve kararlı çalışıyor."
                  )
                  val advice = if (isBad) {
                      "ÖNERİ 1 (En Güvenli): Kule demirlerinden, telsizden veya metal yapılardan 1.5 - 2 metre uzaklaşarak yer değiştirin.\n\n" +
                      "ÖNERİ 2: Yer değiştiremiyorsanız bilinen bir kule/tepe üzerinden referans kalibrasyonu yapabilir veya yatay kalibrasyonu serbest bırakabilirsiniz."
                  } else {
                      "Pusula verisi temiz. Kazara sapmayı önlemek için yatay kalibrasyonu kilitli tutmanız önerilir."
                  }

                  AlertDialog.Builder(this)
                      .setTitle(title)
                      .setMessage(statusLine + advice)
                      .setPositiveButton("Yer Değiştireceğim (Kilitli Kal)") { _, _ ->
                          setHorizontalLockState(true)
                      }
                      .setNeutralButton("Ref. Nokta Kalibrasyonu") { _, _ ->
                          showKnownReferenceDialog()
                      }
                      .setNegativeButton(if (arOverlay.isHorizontalCalLocked) "Yatay Kilidi Aç" else "Kapat") { _, _ ->
                          if (arOverlay.isHorizontalCalLocked) {
                              setHorizontalLockState(false)
                          }
                      }
                      .setOnDismissListener { isAnomalyDialogOpen = false }
                      .show()
              }

              private fun showKnownReferenceDialog() {
                  val layout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(44, 24, 44, 16)
                  }

                  val info = TextView(this).apply {
                      text = "Nişangahı bilinen bir kule veya tepeye tam hizaladıktan sonra, o noktanın koordinatlarını girin. Sistem gerçek coğrafi yönü hesaplayıp sapmayı otomatik sıfırlayacaktır."
                      setPadding(0, 0, 0, 20)
                  }

                  val etLat = EditText(this).apply {
                      hint = "Referans Enlem (Örn: 37.45210)"
                      inputType = InputType.TYPE_CLASS_NUMBER or InputType.TYPE_NUMBER_FLAG_DECIMAL
                  }
                  val etLon = EditText(this).apply {
                      hint = "Referans Boylam (Örn: 29.31050)"
                      inputType = InputType.TYPE_CLASS_NUMBER or InputType.TYPE_NUMBER_FLAG_DECIMAL
                  }

                  layout.addView(info)
                  layout.addView(etLat)
                  layout.addView(etLon)

                  AlertDialog.Builder(this)
                      .setTitle("Bilinen Nokta / Kule Referans Kalibrasyonu")
                      .setView(layout)
                      .setPositiveButton("Bu Noktaya Hizala ve Kilitle") { _, _ ->
                          val tLat = etLat.text.toString().replace(",", ".").toDoubleOrNull()
                          val tLon = etLon.text.toString().replace(",", ".").toDoubleOrNull()
                          if (tLat == null || tLon == null) {
                              Toast.makeText(this, "Geçerli enlem ve boylam girin!", Toast.LENGTH_LONG).show()
                              return@setPositiveButton
                          }
                          val obsAlt = demEngine.getElevation(currentLat, currentLon) + towerHeightOffset
                          val (trueBearing, _, dist) = demEngine.calculateBearingAndPitch(
                              currentLat, currentLon, obsAlt, tLat, tLon
                          )
                          if (dist < 50.0) {
                              Toast.makeText(this, "Referans nokta bulunduğunuz konuma çok yakın!", Toast.LENGTH_LONG).show()
                              return@setPositiveButton
                          }
                          val appliedOffset = sensorFusion.calibrateAzimuthToKnownBearing(trueBearing)
                          arOverlay.manualAzimuthOffset = appliedOffset
                          setHorizontalLockState(true)
                          refreshHorizonAsync(trueBearing.toFloat())
                          Toast.makeText(
                              this,
                              String.format(
                                  Locale.US,
                                  "Referans hizalandı! Gerçek yön: %.1f° | Düzeltme: %+.1f° (Kilitlendi)",
                                  trueBearing, appliedOffset
                              ),
                              Toast.LENGTH_LONG
                          ).show()
                      }
                      .setNegativeButton("İptal", null)
                      .show()
              }

              private fun showRegionDownloadDialog() {
                  val regionNames = ArrayList<String>()
                  regionNames.add("Otomatik: Bulunduğum GPS Konumu ve Yakın Sınırları İndir")
                  regionNames.addAll(demEngine.obmRegions.keys)

                  AlertDialog.Builder(this)
                      .setTitle("Bölge Müdürlüğü Harita (DEM) Verisi İndir")
                      .setItems(regionNames.toTypedArray()) { _, which ->
                          val tilesToDownload = if (which == 0) {
                              demEngine.getSurroundingTilesForGps(currentLat, currentLon)
                          } else {
                              val selectedKey = regionNames[which]
                              demEngine.obmRegions[selectedKey] ?: emptyList()
                          }
                          startTileDownloadWithProgress(tilesToDownload)
                      }
                      .setNegativeButton("İptal", null)
                      .show()
              }

              private fun startTileDownloadWithProgress(tiles: List<String>) {
                  if (tiles.isEmpty()) return
                  val progressTv = TextView(this).apply {
                      text = "Harita sunucusuna bağlanılıyor..."
                      setPadding(48, 36, 48, 36)
                      setTextColor(Color.BLACK)
                  }
                  val dlg = AlertDialog.Builder(this)
                      .setTitle("Arazi Yükseklik Verisi İndiriliyor")
                      .setView(progressTv)
                      .setCancelable(false)
                      .create()
                  dlg.show()

                  bgExecutor.execute {
                      val count = demEngine.downloadTilesSync(tiles) { status ->
                          uiHandler.post { progressTv.text = status }
                      }
                      uiHandler.post {
                          dlg.dismiss()
                          Toast.makeText(
                              this,
                              "$count / ${tiles.size} bölge paftası çevrimdışı hafızaya kaydedildi!",
                              Toast.LENGTH_LONG
                          ).show()
                          refreshHorizonAsync(arOverlay.currentAzimuth)
                      }
                  }
              }

              private val raycastLoop = object : Runnable {
                  override fun run() {
                      val az = arOverlay.currentAzimuth.toDouble()
                      val rawAz = arOverlay.rawAzimuth.toDouble()
                      val pitch = arOverlay.currentPitch.toDouble()
                      val obs2 = arOverlay.secondObserverRay
                      val hasOffset = abs(sensorFusion.manualAzimuthOffset) > 0.15f

                      bgExecutor.execute {
                          val terrainAlt = demEngine.getElevation(currentLat, currentLon) + towerHeightOffset
                          val hit = if (obs2 != null) {
                              demEngine.triangulateTwoRays(
                                  currentLat, currentLon, terrainAlt, az, pitch,
                                  obs2.lat, obs2.lon, obs2.alt, obs2.azimuth, obs2.pitch
                              ) ?: demEngine.castRayToGround(currentLat, currentLon, terrainAlt, az, pitch)
                          } else {
                              demEngine.castRayToGround(currentLat, currentLon, terrainAlt, az, pitch)
                          }

                          val rawHit = if (hasOffset) {
                              demEngine.castRayToGround(currentLat, currentLon, terrainAlt, rawAz, pitch)
                          } else null

                          uiHandler.post {
                              arOverlay.observerLat = currentLat
                              arOverlay.observerLon = currentLon
                              arOverlay.observerAlt = terrainAlt
                              arOverlay.currentHit = hit
                              lastRawHit = rawHit
                              arOverlay.invalidate()
                          }
                      }
                      uiHandler.postDelayed(this, 250)
                  }
              }

              private fun refreshHorizonAsync(centerAz: Float) {
                  bgExecutor.execute {
                      val terrainAlt = demEngine.getElevation(currentLat, currentLon) + towerHeightOffset
                      val profile = demEngine.buildHorizonAndContours(currentLat, currentLon, terrainAlt, centerAz, 70f)
                      uiHandler.post {
                          arOverlay.horizonProfile = profile
                          arOverlay.invalidate()
                      }
                  }
              }

              private fun showTowerHeightDialog(btn: Button) {
                  val input = EditText(this).apply {
                      setText(towerHeightOffset.toInt().toString())
                      inputType = InputType.TYPE_CLASS_NUMBER
                  }
                  AlertDialog.Builder(this)
                      .setTitle("Zeminden Gözetleme Yüksekliği (Metre)")
                      .setMessage("Bulunduğunuz kulenin veya noktanın arazi zemininden yüksekliğini girin:")
                      .setView(input)
                      .setPositiveButton("Kaydet") { _, _ ->
                          towerHeightOffset = input.text.toString().toDoubleOrNull() ?: 2.0
                          btn.text = "Kule +${towerHeightOffset.toInt()}m"
                          refreshHorizonAsync(arOverlay.currentAzimuth)
                      }
                      .setNegativeButton("İptal", null)
                      .show()
              }

              private fun showSecondRayDialog() {
                  val input = EditText(this).apply {
                      hint = "Örn: 0A4F-91K2-B82M"
                  }
                  AlertDialog.Builder(this)
                      .setTitle("2. Gözetleme Noktası Kestirme Kodu")
                      .setMessage("Diğer kuleden telsiz veya mesajla gelen 12 haneli akıllı kodu girin:")
                      .setView(input)
                      .setPositiveButton("Kesiştir") { _, _ ->
                          val decoded = KmlAndCodeCodec.decodeObserverCode(input.text.toString())
                          if (decoded != null) {
                              arOverlay.secondObserverRay = decoded
                              Toast.makeText(this, "2. Kule lazer hattı ekrana eklendi!", Toast.LENGTH_LONG).show()
                          } else {
                              Toast.makeText(this, "Geçersiz kod formatı!", Toast.LENGTH_SHORT).show()
                          }
                      }
                      .setNeutralButton("Kestirmeyi Kapat") { _, _ ->
                          arOverlay.secondObserverRay = null
                      }
                      .setNegativeButton("İptal", null)
                      .show()
              }

              private fun exportAndShareKml() {
                  val hit = arOverlay.currentHit
                  if (hit == null) {
                      Toast.makeText(this, "Nişangah henüz bir arazi yüzeyine temas etmiyor!", Toast.LENGTH_LONG).show()
                      return
                  }

                  val obsAlt = demEngine.getElevation(currentLat, currentLon) + towerHeightOffset
                  val packet = ObserverPacket(
                      lat = currentLat,
                      lon = currentLon,
                      alt = obsAlt,
                      azimuth = arOverlay.currentAzimuth.toDouble(),
                      pitch = arOverlay.currentPitch.toDouble()
                  )

                  val radioCode = KmlAndCodeCodec.encodeObserverCode(packet)
                  val hasCalOffset = abs(sensorFusion.manualAzimuthOffset) > 0.15f

                  val dialogLayout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(44, 24, 44, 16)
                  }

                  val summaryTv = TextView(this).apply {
                      text = String.format(
                          Locale.US,
                          "Hedef Koordinatı: %.5f, %.5f\nMesafe: %d m (±%d m)\nYatay Sapma Ofseti: %+.1f°\n\nTelsiz / Diğer Kule Kestirme Kodu:\n%s",
                          hit.hitLat, hit.hitLon,
                          hit.distanceMeters.toInt(), hit.radialErrorMeters.toInt(),
                          sensorFusion.manualAzimuthOffset,
                          radioCode
                      )
                  }
                  dialogLayout.addView(summaryTv)

                  val cbDualPath = CheckBox(this).apply {
                      text = "İkili Güzergah KML (Ham pusula hattını da ekle)"
                      isChecked = true
                  }
                  if (hasCalOffset && lastRawHit != null) {
                      dialogLayout.addView(cbDualPath)
                  }

                  AlertDialog.Builder(this)
                      .setTitle("Hedef Oluşturuldu!")
                      .setView(dialogLayout)
                      .setPositiveButton("KML Dosyasını Paylaş") { _, _ ->
                          val includeDual = hasCalOffset && lastRawHit != null && cbDualPath.isChecked
                          val kmlText = KmlAndCodeCodec.buildKmlContent(
                              obs1 = packet,
                              obs2 = arOverlay.secondObserverRay,
                              hit = hit,
                              radioCode = radioCode,
                              operatorSummary = arOverlay.activeUserLabel,
                              rawHitForDualPath = if (includeDual) lastRawHit else null,
                              rawAzimuthDeg = arOverlay.rawAzimuth.toDouble(),
                              manualAzOffsetDeg = sensorFusion.manualAzimuthOffset.toDouble(),
                              magneticFieldUt = arOverlay.magneticFieldUt,
                              isMagneticAnomaly = arOverlay.isMagneticAnomaly
                          )

                          val kmlDir = File(cacheDir, "kml")
                          if (!kmlDir.exists()) kmlDir.mkdirs()
                          val kmlFile = File(kmlDir, "Gozetleme_Hedef_${System.currentTimeMillis()}.kml")
                          kmlFile.writeText(kmlText)

                          val uri = FileProvider.getUriForFile(this, "$packageName.fileprovider", kmlFile)
                          val shareIntent = Intent(Intent.ACTION_SEND).apply {
                              type = "application/vnd.google-earth.kml+xml"
                              putExtra(Intent.EXTRA_STREAM, uri)
                              putExtra(Intent.EXTRA_TEXT, "Gözetleme Kestirme Kodu: $radioCode")
                              addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                          }
                          startActivity(Intent.createChooser(shareIntent, "KML Hedefini Paylaş"))
                      }
                      .setNegativeButton("Kapat", null)
                      .show()
              }

              private fun checkPermissionsAndStart() {
                  val perms = arrayOf(Manifest.permission.CAMERA, Manifest.permission.ACCESS_FINE_LOCATION)
                  val missing = perms.filter { ContextCompat.checkSelfPermission(this, it) != PackageManager.PERMISSION_GRANTED }
                  if (missing.isNotEmpty()) {
                      ActivityCompat.requestPermissions(this, missing.toTypedArray(), 101)
                  } else {
                      startCameraAndLocation()
                  }
              }

              override fun onRequestPermissionsResult(requestCode: Int, permissions: Array<out String>, grantResults: IntArray) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults)
                  if (requestCode == 101) startCameraAndLocation()
              }

              private fun startCameraAndLocation() {
                  val cameraProviderFuture = ProcessCameraProvider.getInstance(this)
                  cameraProviderFuture.addListener({
                      val provider = cameraProviderFuture.get()
                      val preview = Preview.Builder().build().also {
                          it.setSurfaceProvider(previewView.surfaceProvider)
                      }
                      provider.unbindAll()
                      camera = provider.bindToLifecycle(this, CameraSelector.DEFAULT_BACK_CAMERA, preview)
                  }, ContextCompat.getMainExecutor(this))

                  try {
                      val lm = getSystemService(LOCATION_SERVICE) as LocationManager
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.ACCESS_FINE_LOCATION) == PackageManager.PERMISSION_GRANTED) {
                          lm.requestLocationUpdates(LocationManager.GPS_PROVIDER, 2000L, 2f, this)
                          lm.getLastKnownLocation(LocationManager.GPS_PROVIDER)?.let { onLocationChanged(it) }
                      }
                  } catch (_: Exception) {}
              }

              override fun onLocationChanged(location: Location) {
                  currentLat = location.latitude
                  currentLon = location.longitude

                  if (!promptedForMissingGpsTile && !demEngine.isTileAvailable(currentLat, currentLon)) {
                      promptedForMissingGpsTile = true
                      val tileKey = demEngine.formatTileKey(kotlin.math.floor(currentLat).toInt(), kotlin.math.floor(currentLon).toInt())
                      AlertDialog.Builder(this)
                          .setTitle("Yeni Bölge Tespit Edildi ($tileKey)")
                          .setMessage("Bulunduğunuz GPS konumunun arazi yükseklik verisi cihazda yüklü değil. Şimdi otomatik olarak indirilsin mi?")
                          .setPositiveButton("İndir") { _, _ ->
                              startTileDownloadWithProgress(demEngine.getSurroundingTilesForGps(currentLat, currentLon))
                          }
                          .setNegativeButton("Daha Sonra", null)
                          .show()
                  }

                  val alt = demEngine.getElevation(currentLat, currentLon)
                  sensorFusion.updateDeclination(currentLat, currentLon, alt)
                  refreshHorizonAsync(arOverlay.currentAzimuth)
              }

              override fun onResume() {
                  super.onResume()
                  sensorFusion.start()
              }

              override fun onPause() {
                  super.onPause()
                  sensorFusion.stop()
              }
          }
          EOF

      - name: Denizli OBM SRTM (DEM) Yukseklik Verilerini Indir ve Gom
        run: |
          cd app/src/main/assets/dem
          TILES=("N36E028" "N36E029" "N37E028" "N37E029" "N38E028" "N38E029")
          for TILE in "${TILES[@]}"; do
            LAT_DIR="${TILE:0:3}"
            URL="https://s3.amazonaws.com/elevation-tiles-prod/skadi/${LAT_DIR}/${TILE}.hgt.gz"
            echo "Indiriliyor: ${TILE}.hgt.gz ..."
            curl -s -f -L "$URL" -o "${TILE}.hgt.gz"
            gunzip -f "${TILE}.hgt.gz"
          done
          ls -lh

      - name: Kodlari Guvenle Sifrele ve Imzali Release APK Derle
        run: gradle assembleRelease --stacktrace --no-daemon

      - name: APK Dosyasini Indirilebilir Paket Olarak Yukle
        uses: actions/upload-artifact@v4
        with:
          name: GozetlemeKamerasi-DenizliOBM-APK
          path: app/build/outputs/apk/release/app-release.apk

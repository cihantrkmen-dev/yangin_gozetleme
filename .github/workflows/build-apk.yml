          # 11. KmlAndCodeCodec.kt (İkili Güzergah: Kalibre Edilmiş + Ham Pusula Hattı Seçeneği)
          cat << 'EOF' > app/src/main/java/tr/gov/ogm/gozetleme/KmlAndCodeCodec.kt
          package tr.gov.ogm.gozetleme

          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale
          import kotlin.math.roundToLong

          data class ObserverPacket(
              val lat: Double,
              val lon: Double,
              val alt: Double,
              val azimuth: Double,
              val pitch: Double
          )

          object KmlAndCodeCodec {
              fun encodeObserverCode(p: ObserverPacket): String {
                  val latInt = ((p.lat - 35.0) * 10000.0).roundToLong().coerceIn(0, 65535)
                  val lonInt = ((p.lon - 25.0) * 10000.0).roundToLong().coerceIn(0, 131071)
                  val altInt = p.alt.roundToLong().coerceIn(0, 4095)
                  val azInt = (p.azimuth * 10.0).roundToLong().coerceIn(0, 3600)
                  val pitchInt = ((p.pitch + 45.0) * 10.0).roundToLong().coerceIn(0, 900)

                  var packed = 0UL
                  packed = (packed shl 16) or latInt.toULong()
                  packed = (packed shl 17) or lonInt.toULong()
                  packed = (packed shl 12) or altInt.toULong()
                  packed = (packed shl 12) or azInt.toULong()
                  packed = (packed shl 7) or (pitchInt.toULong() shr 3)

                  val raw = packed.toString(36).uppercase(Locale.US).padStart(12, '0')
                  return "${raw.substring(0, 4)}-${raw.substring(4, 8)}-${raw.substring(8, 12)}"
              }

              fun decodeObserverCode(code: String): ObserverPacket? {
                  return try {
                      val clean = code.replace("-", "").trim().uppercase(Locale.US)
                      val packed = clean.toULong(36)
                      val pitchHigh = (packed and 0x7FUL).toLong() shl 3
                      val azInt = ((packed shr 7) and 0xFFFUL).toLong()
                      val altInt = ((packed shr 19) and 0xFFFUL).toLong()
                      val lonInt = ((packed shr 31) and 0x1FFFFUL).toLong()
                      val latInt = ((packed shr 48) and 0xFFFFUL).toLong()

                      ObserverPacket(
                          lat = 35.0 + latInt / 10000.0,
                          lon = 25.0 + lonInt / 10000.0,
                          alt = altInt.toDouble(),
                          azimuth = azInt / 10.0,
                          pitch = (pitchHigh / 10.0) - 45.0
                      )
                  } catch (e: Exception) {
                      null
                  }
              }

              fun buildKmlContent(
                  obs1: ObserverPacket,
                  obs2: ObserverPacket?,
                  hit: RayHitResult,
                  radioCode: String,
                  operatorSummary: String,
                  rawHitForDualPath: RayHitResult? = null,
                  rawAzimuthDeg: Double = obs1.azimuth,
                  manualAzOffsetDeg: Double = 0.0,
                  magneticFieldUt: Float = 0f,
                  isMagneticAnomaly: Boolean = false
              ): String {
                  val timeStr = SimpleDateFormat("yyyy-MM-dd HH:mm:ss", Locale.US).format(Date())
                  val polyCoords = hit.polygonPoints.joinToString("\n") {
                      "${it.second},${it.first},${hit.hitEle}"
                  }

                  val secondLineXml = if (obs2 != null) {
                      """
                      <Placemark>
                          <name>2. Gözetleme Noktası (Kestirme)</name>
                          <Style><LineStyle><color>ff00ffff</color><width>3</width></LineStyle></Style>
                          <LineString>
                              <altitudeMode>absolute</altitudeMode>
                              <coordinates>
                                  ${obs2.lon},${obs2.lat},${obs2.alt}
                                  ${hit.hitLon},${hit.hitLat},${hit.hitEle}
                              </coordinates>
                          </LineString>
                      </Placemark>
                      """.trimIndent()
                  } else ""

                  val dualRawPathXml = if (rawHitForDualPath != null) {
                      """
                      <Placemark>
                          <name>Ham Pusula Bakış Hattı (Kalibrasyonsuz: ${String.format(Locale.US, "%.1f", rawAzimuthDeg)}°)</name>
                          <Style><LineStyle><color>ff00a5ff</color><width>2</width></LineStyle></Style>
                          <LineString>
                              <altitudeMode>absolute</altitudeMode>
                              <coordinates>
                                  ${obs1.lon},${obs1.lat},${obs1.alt}
                                  ${rawHitForDualPath.hitLon},${rawHitForDualPath.hitLat},${rawHitForDualPath.hitEle}
                              </coordinates>
                          </LineString>
                      </Placemark>
                      <Placemark>
                          <name>Ham Pusula Hedefi (Karşılaştırma)</name>
                          <description><![CDATA[
                              <b>Not:</b> Kalibrasyon ofseti (${String.format(Locale.US, "%+.1f°", manualAzOffsetDeg)}) uygulanmadan önceki ham sensör hedefi.<br/>
                              <b>Koordinat:</b> ${String.format(Locale.US, "%.5f, %.5f", rawHitForDualPath.hitLat, rawHitForDualPath.hitLon)}<br/>

                      <b>Koordinat:</b> ${String.format(Locale.US, "%.5f, %.5f", hit.hitLat, hit.hitLon)}<br/>
                      <b>Rakım:</b> ${String.format(Locale.US, "%.0f", hit.hitEle)} m<br/>
                      <b>Mesafe:</b> ${String.format(Locale.US, "%.0f", hit.distanceMeters)} m<br/>
                      <b>Azimut / Eğim:</b> ${String.format(Locale.US, "%.1f° / %.1f°", obs1.azimuth, obs1.pitch)}<br/>
                      <b>Yatay Kalibrasyon Sapması:</b> ${String.format(Locale.US, "%+.1f°", manualAzOffsetDeg)} (Ham: ${String.format(Locale.US, "%.1f°", rawAzimuthDeg)})<br/>
                      <b>Manyetik Alan Durumu:</b> $magStatus<br/>

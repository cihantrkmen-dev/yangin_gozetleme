                  } else ""

                  val modeTitle = if (hit.isTriangulated) "İKİLİ KESTİRME HEDEFİ" else "DOĞRUDAN ARAZİ ÇAKIŞTIRMA HEDEFİ"
                  val magStatus = if (isMagneticAnomaly) "PARAZİT UYARISI (${String.format(Locale.US, "%.1f", magneticFieldUt)} µT)" else "NORMAL (${String.format(Locale.US, "%.1f", magneticFieldUt)} µT)"

                  return """<?xml version="1.0" encoding="UTF-8"?>
          <kml xmlns="http://www.opengis.net/kml/2.2">
          <Document>
              <name>OGM Gözetleme Hedef Raporu - $timeStr</name>
              <ExtendedData>
